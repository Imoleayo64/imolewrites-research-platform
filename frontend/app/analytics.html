<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — ImoleWrites Research Hub</title>
  <meta name="description" content="Visualize writing progress, research activity, AI usage, and publication tracking." />
  <meta name="theme-color" content="#0b1120" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M9 17V8.5l5 3.5-5 3.5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div data-mount="sidebar" data-active="analytics"></div>
    <div data-mount="sidebar-backdrop"></div>

    <div class="main">
      <div data-mount="topbar" data-title="Analytics"></div>

      <div class="content">
        <div class="page-title-row">
          <div><h1>Analytics</h1><p>Your research activity, writing progress, and AI usage at a glance.</p></div>
          <div class="flex items-center gap-2 padding:5px;background:var(--surface-3);border-radius:var(--radius-full);border:1px solid var(--border);">
            <select id="periodSelect" class="select" style="border:0;background:transparent;width:auto;">
              <option value="30">Last 30 days</option><option value="7">Last 7 days</option><option value="90">This quarter</option><option value="365">This year</option>
            </select>
            <button id="exportAnalyticsBtn" class="btn btn-secondary btn-sm"><span data-icon="download"></span> Export</button>
          </div>
        </div>

        <!-- Stat cards -->
        <div class="stat-grid" style="margin-bottom:24px;">
          <div class="card stat-card">
            <div class="stat-card__top"><span class="stat-card__label">Total words</span><span class="icon-tile xs bg-blue"><span data-icon="pen"></span></span></div>
            <div class="stat-card__value"><span id="statTotalWords">0</span></div>
          </div>
          <div class="card stat-card">
            <div class="stat-card__top"><span class="stat-card__label">Papers searched</span><span class="icon-tile xs bg-teal"><span data-icon="bookOpen"></span></span></div>
            <div class="stat-card__value"><span id="statPapersSearched">0</span></div>
          </div>
          <div class="card stat-card">
            <div class="stat-card__top"><span class="stat-card__label">AI interactions</span><span class="icon-tile xs bg-purple"><span data-icon="sparkles"></span></span></div>
            <div class="stat-card__value"><span id="statAiInteractions">0</span></div>
          </div>
          <div class="card stat-card">
            <div class="stat-card__top"><span class="stat-card__label">Publications</span><span class="icon-tile xs bg-amber"><span data-icon="award"></span></span></div>
            <div class="stat-card__value"><span id="statPublications">0</span></div>
          </div>
        </div>

        <!-- Charts -->
        <div class="dash-grid" style="margin-bottom:24px;">
          <div class="panel">
            <div class="panel__head"><h3>Writing activity</h3><div class="flex items-center gap-3"><span class="badge badge-blue">Saves</span><span class="badge badge-teal">Citations added</span></div></div>
            <div class="panel__body"><div id="writingChart" style="height:280px;"></div></div>
          </div>
          <div class="panel">
            <div class="panel__head"><h3>Activity mix</h3></div>
            <div class="panel__body">
              <div id="timeDonut" style="height:200px;"></div>
              <div id="activityLegend" class="flex flex-col gap-2" style="margin-top:16px;"></div>
            </div>
          </div>
        </div>

        <div class="dash-grid">
          <div class="panel">
            <div class="panel__head"><h3>AI usage by feature</h3></div>
            <div class="panel__body"><div id="aiBarChart" style="height:260px;"></div></div>
          </div>
          <div class="panel">
            <div class="panel__head"><h3>Publication tracking</h3></div>
            <div class="panel__body" style="padding-top:6px;padding-bottom:6px;" id="pubTracking">
              <p class="text-muted" style="font-size:var(--fs-sm);padding:12px 4px;">No projects marked beyond draft status yet.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/analytics.js"></script>
</body>
</html>
