<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Center — ImoleWrites Research Hub</title>
  <meta name="description" content="Find answers, browse guides, and get support." />
  <meta name="theme-color" content="#0b1120" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M9 17V8.5l5 3.5-5 3.5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <div data-mount="sidebar" data-active="help"></div>
    <div data-mount="sidebar-backdrop"></div>

    <div class="main">
      <div data-mount="topbar" data-title="Help Center"></div>

      <div class="content">
        <!-- Hero search -->
        <div class="text-center" style="padding-block:24px 36px;">
          <h1 style="font-size:var(--fs-4xl);">How can we help?</h1>
          <p class="text-muted" style="margin-top:8px;">Search our knowledge base or browse popular topics.</p>
          <div class="topbar__search input-group" style="margin:24px auto 0;max-width:560px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-full);height:54px;">
            <span class="input-icon" style="left:18px;"><span data-icon="search"></span></span>
            <input id="helpSearch" type="text" placeholder="Search for help..." style="background:transparent;border:0;height:54px;padding-left:46px;" />
          </div>
        </div>

        <!-- Quick categories -->
        <div class="grid grid-4 gap-card" style="margin-bottom:36px;" id="helpCategories"></div>

        <div class="dash-grid">
          <!-- Popular articles -->
          <div class="panel">
            <div class="panel__head"><h3>All articles</h3></div>
            <div class="panel__body" style="padding-top:6px;padding-bottom:6px;" id="helpArticleList"></div>
          </div>

          <!-- Contact support -->
          <div class="flex flex-col gap-6">
            <div class="card card-pad-lg text-center">
              <span class="icon-tile bg-blue" style="margin-inline:auto;margin-bottom:14px;"><span data-icon="headset"></span></span>
              <h3 style="margin-bottom:6px;">Talk to support</h3>
              <p class="text-muted" style="font-size:var(--fs-sm);margin-bottom:18px;">Email us and we'll get back to you.</p>
              <a class="btn btn-primary btn-block" href="mailto:support@imolewrites.com">Email support</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Article modal -->
  <div class="modal-overlay" id="helpArticleModal">
    <div class="modal" style="max-width:560px;">
      <h3 id="helpArticleTitle" style="margin-bottom:12px;"></h3>
      <div id="helpArticleBody" style="font-size:var(--fs-sm);line-height:1.7;color:var(--text-2);"></div>
      <button class="btn btn-secondary btn-block" style="margin-top:18px;" data-modal-close>Close</button>
    </div>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/help.js"></script>
</body>
</html>
